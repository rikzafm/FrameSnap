name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:engine
      - name: Store build
        run: npm run build
      - name: Personal build
        run: npm run build:personal
      - name: Store build contains no YouTube code or permissions
        run: npm run check:store
